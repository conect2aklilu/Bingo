version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bingo
      POSTGRES_PASSWORD: bingo
      POSTGRES_DB: bingo
    ports:
      - "5432:5432"
    volumes:
      - bingo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgres://bingo:bingo@postgres:5432/bingo
      JWT_SECRET: change_this_to_a_long_random_secret
      CORS_ORIGIN: http://localhost:5173
      PLATFORM_FEE_PERCENT: 25
      STAKE_TIERS: "10,50,100,200"
      CALL_INTERVAL_MS: 2500
      STARTING_VIRTUAL_BALANCE: 0
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change_this_password
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"

volumes:
  bingo_pgdata:
