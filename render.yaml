services:
  - type: web
    name: merged-bingo-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://merged-bingo-frontend.onrender.com
      - key: PLATFORM_FEE_PERCENT
        value: 25
      - key: STAKE_TIERS
        value: 10,50,100,200
      - key: CALL_INTERVAL_MS
        value: 2500
      - key: STARTING_VIRTUAL_BALANCE
        value: 0
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: merged-bingo-db
          property: connectionString

  - type: web
    name: merged-bingo-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://merged-bingo-backend.onrender.com

  - type: psql
    name: merged-bingo-db
    plan: starter
